<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal Sign In - Smart Job Finder</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="admin-auth-body">

    <header class="app-header">
        <div class="header-content">
            <a href="index.html" class="logo-title">
                <span class="logo-icon admin-icon">🛡️</span>
                <div>
                    <h1>Smart Job Finder</h1>
                </div>
            </a>
            <div class="header-actions">
                <a href="login.html" class="btn btn-secondary btn-sm">Job Seeker Portal</a>
                <a href="index.html" class="btn btn-outline btn-sm">Home</a>
            </div>
        </div>
    </header>

    <div class="auth-wrapper">
        <div class="auth-card admin-auth-card">
            <div class="auth-header">
                <div class="logo-badge admin-badge">🛡️</div>
                <div class="badge-pill-admin">Administrative Access</div>
                <h2>Admin Console Login</h2>
                <p>Secure sign-in for platform management and company moderation.</p>
            </div>

            <!-- Dynamic Alert Banner for feedback -->
            <div id="alertBanner" class="alert-banner"></div>

            <form action="adminLogin" method="post">
                <div class="form-group">
                    <label for="username">Admin Username</label>
                    <input type="text"
                           id="username"
                           name="username"
                           class="form-control"
                           placeholder="admin"
                           required
                           autocomplete="username"
                           autofocus>
                </div>

                <div class="form-group">
                    <label for="password">Admin Password</label>
                    <div class="password-input-wrapper">
                        <input type="password"
                               id="password"
                               name="password"
                               class="form-control"
                               placeholder="••••••••"
                               required
                               autocomplete="current-password">
                        <button type="button" class="btn-toggle-pwd" id="togglePasswordBtn" title="Toggle password visibility">👁️</button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 8px;">
                    Authenticate & Access Dashboard →
                </button>
            </form>

            <div class="admin-auth-footer">
                <div class="credential-hint">
                    🛡️ <strong>Admin Access:</strong> Authorized administrator access only.
                </div>
                <div style="margin-top: 16px; font-size: 13px; color: var(--text-muted);">
                    Not an administrator? 
                    <a href="login.html" style="color: var(--primary); font-weight: 600; text-decoration: none;">Job Seeker Sign In</a>
                </div>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
    <script>
        // Password toggle
        const toggleBtn = document.getElementById('togglePasswordBtn');
        const pwdInput = document.getElementById('password');
        if (toggleBtn && pwdInput) {
            toggleBtn.addEventListener('click', () => {
                const isPassword = pwdInput.getAttribute('type') === 'password';
                pwdInput.setAttribute('type', isPassword ? 'text' : 'password');
                toggleBtn.textContent = isPassword ? '🙈' : '👁️';
            });
        }
    </script>
</body>
</html>
