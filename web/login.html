<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Smart Job Finder</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="app-header">
        <div class="header-content">
            <a href="index.html" class="logo-title">
                <span class="logo-icon">⚡</span>
                <h1>Smart Job Finder</h1>
            </a>
            <div class="header-actions">
                <a href="register.html" class="btn btn-secondary btn-sm">Create Account</a>
                <a href="admin-login.html" class="btn btn-outline btn-sm">🛡️ Admin Login</a>
            </div>
        </div>
    </header>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo-badge">🔐</div>
                <h2>Welcome Back</h2>
                <p>Sign in to discover curated jobs matching your skills.</p>
            </div>

            <!-- Dynamic Alert Banner for feedback from RegisterServlet / LoginServlet -->
            <div id="alertBanner" class="alert-banner"></div>

            <form action="login" method="post">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email"
                           id="email"
                           name="email"
                           class="form-control"
                           placeholder="name@example.com"
                           required
                           autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password"
                           id="password"
                           name="password"
                           class="form-control"
                           placeholder="Enter your password"
                           required
                           autocomplete="current-password">
                </div>

                <button type="submit" class="btn btn-primary">
                    Sign In →
                </button>
            </form>

            <div style="margin-top: 24px; font-size: 14px; color: var(--text-muted);">
                Don't have an account yet? 
                <a href="register.html" style="color: var(--primary); font-weight: 600; text-decoration: none;">Register here</a>
            </div>

            <div style="margin-top: 20px; padding-top: 16px; border-top: 1px dashed var(--border-color); font-size: 13px; color: var(--text-muted);">
                Are you an administrator? 
                <a href="admin-login.html" style="color: #2563eb; font-weight: 600; text-decoration: none;">Admin Console Sign In 🛡️</a>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
