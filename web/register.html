<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Smart Job Finder</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="app-header">
        <div class="header-content">
            <a href="index.html" class="logo-title">
                <span class="logo-icon">⚡</span>
                <h1>Smart Job Finder</h1>
            </a>
            <div class="header-actions">
                <a href="login.html" class="btn btn-secondary btn-sm">Sign In</a>
                <a href="admin-login.html" class="btn btn-outline btn-sm">🛡️ Admin Portal</a>
            </div>
        </div>
    </header>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo-badge">✨</div>
                <h2>Create Account</h2>
                <p>Join thousands of professionals finding their ideal roles.</p>
            </div>

            <!-- Dynamic Alert Banner for feedback -->
            <div id="alertBanner" class="alert-banner"></div>

            <form action="register" method="post">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text"
                           id="name"
                           name="name"
                           class="form-control"
                           placeholder="John Doe"
                           required
                           autocomplete="name">
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email"
                           id="email"
                           name="email"
                           class="form-control"
                           placeholder="name@example.com"
                           required
                           autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="degree">Degree / Qualification</label>
                    <select id="degree" name="degree" class="form-control" required>
                        <option value="B.Tech / B.E." selected>B.Tech / B.E. (Bachelor of Technology / Engineering)</option>
                        <option value="M.Tech / M.E.">M.Tech / M.E. (Master of Technology)</option>
                        <option value="BCA">BCA (Bachelor of Computer Applications)</option>
                        <option value="MCA">MCA (Master of Computer Applications)</option>
                        <option value="B.Sc">B.Sc (Computer Science / IT / Stats)</option>
                        <option value="M.Sc">M.Sc (Computer Science / Data Science)</option>
                        <option value="Diploma">Diploma in Engineering</option>
                    </select>
                </div>

                <div class="form-grid-2">
                    <div class="form-group">
                        <label for="branch">Major / Branch</label>
                        <select id="branch" name="branch" class="form-control" required>
                            <option value="Computer Science & Engineering" selected>Computer Science &amp; Engg (CSE)</option>
                            <option value="Information Technology">Information Technology (IT)</option>
                            <option value="Electronics & Communication">Electronics &amp; Communication (ECE)</option>
                            <option value="Electrical & Electronics">Electrical &amp; Electronics (EEE)</option>
                            <option value="Data Science & AI">Data Science &amp; Artificial Intelligence</option>
                            <option value="Mechanical Engineering">Mechanical Engineering</option>
                            <option value="Civil Engineering">Civil Engineering</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="graduation_year">Graduation Year</label>
                        <input type="number"
                               id="graduation_year"
                               name="graduation_year"
                               class="form-control"
                               min="2020"
                               max="2030"
                               value="2025"
                               required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Create Password</label>
                    <input type="password"
                           id="password"
                           name="password"
                           class="form-control"
                           placeholder="At least 6 characters"
                           minlength="6"
                           required
                           autocomplete="new-password">
                </div>

                <button type="submit" class="btn btn-primary">
                    Create Account &amp; Send Confirmation Email →
                </button>
            </form>

            <div style="margin-top: 24px; font-size: 14px; color: var(--text-muted);">
                Already have an account? 
                <a href="login.html" style="color: var(--primary); font-weight: 600; text-decoration: none;">Sign in here</a>
            </div>

            <div style="margin-top: 20px; padding-top: 16px; border-top: 1px dashed var(--border-color); font-size: 13px; color: var(--text-muted);">
                Administrator? 
                <a href="admin-login.html" style="color: #2563eb; font-weight: 600; text-decoration: none;">Admin Sign In 🛡️</a>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
